<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initiative Tracker</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚔️ Initiative Tracker</h1>
            <div class="controls">
                <button class="btn-add" onclick="addTile()">+ Add Tile</button>
                <button class="btn-clear" onclick="clearAllTiles()">Clear All</button>
                <button class="btn-save" onclick="saveCollection()">💾 Save Collection</button>
                <div class="dropdown">
                    <button class="btn-load" onclick="toggleDropdown('loadDropdown')">📁 Load Collection</button>
                    <div id="loadDropdown" class="dropdown-content">
                        <!-- Collections will be populated here -->
                    </div>
                </div>
                <div class="dropdown">
                    <button class="btn-rename" onclick="toggleDropdown('renameDropdown')">✏️ Rename Collection</button>
                    <div id="renameDropdown" class="dropdown-content">
                        <!-- Collections will be populated here -->
                    </div>
                </div>
                <div class="dropdown">
                    <button class="btn-delete" onclick="toggleDropdown('deleteDropdown')">🗑️ Delete Collection</button>
                    <div id="deleteDropdown" class="dropdown-content">
                        <!-- Collections will be populated here -->
                    </div>
                </div>
            </div>
        </div>

        <div class="grid-container" id="gridContainer"></div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <h2>No initiatives yet</h2>
            <p>Click "Add Tile" to start tracking your initiatives</p>
        </div>

        <div class="footer">
            <p>💾 Your tiles are automatically saved locally • 📁 Save collections to server</p>
        </div>
    </div>
<script src="tiles-script.js"></script>

</body>
</html>
