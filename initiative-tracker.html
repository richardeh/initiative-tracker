<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initiative Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-add {
            background-color: #4CAF50;
            color: white;
        }

        .btn-add:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-clear {
            background-color: #f44336;
            color: white;
        }

        .btn-clear:hover {
            background-color: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .tile {
            background: white;
            border-radius: 10px;
            padding: 20px;
            cursor: grab;
            user-select: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 3px solid transparent;
        }

        .tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .tile.active {
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 4px 6px rgba(0,0,0,0.1);
            background: linear-gradient(135deg, #fffef0 0%, #ffffff 100%);
        }

        .tile.active::before {
            content: '★ ACTIVE';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #FFD700;
            color: #333;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .tile.dragging {
            opacity: 0.7;
            cursor: grabbing;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            transform: scale(1.05) translateY(-10px);
            z-index: 1000;
        }

        .tile-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: center;
        }

        .tile-name {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            word-break: break-word;
            cursor: pointer;
            padding: 8px;
            border-radius: 5px;
            transition: background-color 0.2s ease;
        }

        .tile-name:hover {
            background-color: #f5f5f5;
        }

        .tile-name.editing {
            background-color: #fff9c4;
            border: 2px solid #667eea;
        }

        .tile-name-input {
            width: 100%;
            padding: 8px;
            font-size: 1.3em;
            font-weight: 600;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-family: inherit;
        }

        .tile-name-input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 5px rgba(118, 75, 162, 0.5);
        }

        .tile-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background-color: #f44336;
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            opacity: 0;
        }

        .tile:hover .tile-delete {
            opacity: 1;
        }

        .tile-delete:hover {
            background-color: #da190b;
            transform: scale(1.1);
        }

        .tile-number {
            font-size: 0.9em;
            color: #999;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        /* status badges inside tile */
        .tile-statuses {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }

        .status-badge {
            background-color: #e0e0e0;
            color: #333;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            position: relative;
        }
        .status-badge.timer {
            background-color: #c8e6c9;
        }

        .status-badge .status-timer {
            font-weight: 700;
            margin-left: 4px;
        }

        .status-remove {
            background: transparent;
            border: none;
            color: #666;
            font-size: 0.8em;
            cursor: pointer;
            padding: 0 2px;
        }

        .status-remove:hover {
            color: #000;
        }

        .status-add {
            margin-top: 8px;
            align-self: flex-start;
            background-color: #2196F3;
            color: white;
            font-size: 0.75em;
            padding: 4px 8px;
            border-radius: 5px;
        }

        .status-add:hover {
            background-color: #1976D2;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .empty-state h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
        }

        .empty-state p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚔️ Initiative Tracker</h1>
            <div class="controls">
                <button class="btn-add" onclick="addTile()">+ Add Tile</button>
                <button class="btn-clear" onclick="clearAllTiles()">Clear All</button>
            </div>
        </div>

        <div class="grid-container" id="gridContainer"></div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <h2>No initiatives yet</h2>
            <p>Click "Add Tile" to start tracking your initiatives</p>
        </div>

        <div class="footer">
            <p>💾 Your tiles are automatically saved</p>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'initiativeTrackerTiles';
        const ACTIVE_KEY = 'initiativeTrackerActive';
        const GRID_SIZE = 20; // pixels for snap-to-grid
        let tiles = [];
        let activeTileId = null;
        let draggedElement = null;
        let offsetX = 0;
        let offsetY = 0;
        let lastTapTime = 0;
        const DOUBLE_TAP_THRESHOLD = 300;

        // Load tiles from localStorage on page load
        function loadTiles() {
            const stored = localStorage.getItem(STORAGE_KEY);
            tiles = stored ? JSON.parse(stored) : [];
            // ensure each tile has statuses array
            tiles.forEach(t => {
                if (!Array.isArray(t.statuses)) t.statuses = [];
            });
            activeTileId = localStorage.getItem(ACTIVE_KEY);
            renderTiles();
        }

        // Save tiles to localStorage
        function saveTiles() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tiles));
        }

        // Set active tile
        function setActiveTile(id) {
            activeTileId = id === activeTileId ? null : id;
            localStorage.setItem(ACTIVE_KEY, activeTileId);
            renderTiles();
        }

        // Add a new tile
        function addTile() {
            const newTile = {
                id: Date.now(),
                name: 'New Initiative',
                order: tiles.length,
                statuses: []
            };
            tiles.push(newTile);
            saveTiles();
            renderTiles();
            // Auto-focus the new tile for editing
            setTimeout(() => {
                const newElement = document.querySelector(`[data-id="${newTile.id}"]`);
                if (newElement) {
                    const nameElement = newElement.querySelector('.tile-name');
                    editTileName(newTile.id);
                }
            }, 0);
        }

        // Delete a tile
        function deleteTile(id) {
            tiles = tiles.filter(t => t.id !== id);
            saveTiles();
            renderTiles();
        }

        // Clear all tiles
        function clearAllTiles() {
            if (tiles.length === 0) return;
            if (confirm('Are you sure you want to clear all tiles?')) {
                tiles = [];
                saveTiles();
                renderTiles();
            }
        }

        // Edit tile name
        function editTileName(id) {
            const tile = tiles.find(t => t.id === id);
            const element = document.querySelector(`[data-id="${id}"]`);
            const nameElement = element.querySelector('.tile-name');

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'tile-name-input';
            input.value = tile.name;

            nameElement.replaceWith(input);
            input.focus();
            input.select();

            const saveName = () => {
                const newName = input.value.trim() || 'New Initiative';
                tile.name = newName;
                saveTiles();
                renderTiles();
            };

            input.addEventListener('blur', saveName);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') saveName();
            });
        }

        // Render all tiles
        function renderTiles() {
            const container = document.getElementById('gridContainer');
            const emptyState = document.getElementById('emptyState');

            if (tiles.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            container.innerHTML = tiles.map((tile, index) => `
                <div class="tile ${activeTileId == tile.id ? 'active' : ''}" data-id="${tile.id}" draggable="true">
                    <div class="tile-content">
                        <div class="tile-name" onclick="editTileName(${tile.id})">${escapeHtml(tile.name)}</div>
                        <div class="tile-statuses" id="statuses-${tile.id}">
                            ${tile.statuses && tile.statuses.length ? tile.statuses.map(status => `
                                <div class="status-badge${status.expiresAt ? ' timer' : ''}" data-status-id="${status.id}">
                                    <span class="status-name" onclick="editStatusName(${tile.id}, ${status.id})">${escapeHtml(status.name)}</span>
                                    ${status.expiresAt ? `<span class="status-timer">${formatRemaining(status.expiresAt - Date.now())}</span>` : ``}
                                    <button class="status-remove" onclick="removeStatus(${tile.id}, ${status.id})">×</button>
                                </div>
                            `).join('') : ``}
                        </div>
                        <button class="status-add" onclick="addStatus(${tile.id})">+ Status</button>
                    </div>
                    <div class="tile-number">#${index + 1}</div>
                    <button class="tile-delete" onclick="deleteTile(${tile.id})">×</button>
                </div>
            `).join('');

            // Add event listeners to tiles
            document.querySelectorAll('.tile').forEach(tileElement => {
                tileElement.addEventListener('dragstart', handleDragStart);
                tileElement.addEventListener('dragend', handleDragEnd);
                tileElement.addEventListener('dragover', handleDragOver);
                tileElement.addEventListener('drop', handleDrop);
                tileElement.addEventListener('dragenter', handleDragEnter);
                tileElement.addEventListener('dragleave', handleDragLeave);
                tileElement.addEventListener('dblclick', handleDoubleTap);
                tileElement.addEventListener('touchend', handleTouchEnd);
            });
        }

        // Double-tap and double-click handlers
        function handleDoubleTap(e) {
            if (e.target.classList.contains('tile-delete')) return;
            const tileId = parseInt(this.dataset.id);
            setActiveTile(tileId);
        }

        function handleTouchEnd(e) {
            const now = Date.now();
            if (now - lastTapTime < DOUBLE_TAP_THRESHOLD) {
                if (e.target.classList.contains('tile-delete') || e.target.classList.contains('tile-name')) return;
                const tileId = parseInt(this.dataset.id);
                setActiveTile(tileId);
            }
            lastTapTime = now;
        }

        // Drag and drop handlers
        function handleDragStart(e) {
            draggedElement = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
        }

        function handleDragEnd(e) {
            if (draggedElement) draggedElement.classList.remove('dragging');
            document.querySelectorAll('.tile').forEach(t => t.style.opacity = '');
            draggedElement = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            if (this !== draggedElement && this.classList.contains('tile')) {
                this.style.opacity = '0.5';
            }
        }

        function handleDragLeave(e) {
            if (this !== draggedElement) {
                this.style.opacity = '';
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();

            if (this !== draggedElement && this.classList.contains('tile')) {
                // Get the ids
                const draggedId = parseInt(draggedElement.dataset.id);
                const targetId = parseInt(this.dataset.id);

                // Find the indices
                const draggedIndex = tiles.findIndex(t => t.id === draggedId);
                const targetIndex = tiles.findIndex(t => t.id === targetId);

                // Swap the tiles
                if (draggedIndex !== -1 && targetIndex !== -1) {
                    [tiles[draggedIndex], tiles[targetIndex]] = [tiles[targetIndex], tiles[draggedIndex]];
                    saveTiles();
                    renderTiles();
                }
            }

            return false;
        }

        // Utility function to escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // helper to format remaining milliseconds as mm:ss
        function formatRemaining(ms) {
            if (ms <= 0) return '0:00';
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // add a status to a tile (limit 5)
        function addStatus(tileId) {
            const tile = tiles.find(t => t.id === tileId);
            if (!tile) return;
            if (tile.statuses.length >= 5) {
                alert('Maximum of 5 statuses allowed');
                return;
            }
            const name = prompt('Enter status name:');
            if (!name) return;
            const isTimer = confirm('Is this a timer? OK = yes, Cancel = no');
            const status = { id: Date.now(), name: name };
            if (isTimer) {
                const minutes = prompt('Duration in minutes (fractional allowed):');
                const num = parseFloat(minutes);
                if (!isNaN(num) && num > 0) {
                    status.expiresAt = Date.now() + num * 60 * 1000;
                }
            }
            tile.statuses.push(status);
            saveTiles();
            renderTiles();
        }

        function removeStatus(tileId, statusId) {
            const tile = tiles.find(t => t.id === tileId);
            if (!tile) return;
            tile.statuses = tile.statuses.filter(s => s.id !== statusId);
            saveTiles();
            renderTiles();
        }

        function updateTimers() {
            let changed = false;
            tiles.forEach(tile => {
                tile.statuses = tile.statuses.filter(s => {
                    if (s.expiresAt) {
                        if (Date.now() >= s.expiresAt) {
                            changed = true;
                            return false; // remove expired
                        }
                    }
                    return true;
                });
            });
            if (changed) saveTiles();

            document.querySelectorAll('.status-badge').forEach(badge => {
                const statusId = parseInt(badge.dataset.statusId);
                const hex = parseInt(badge.closest('.tile').dataset.id);
                const tile = tiles.find(t => t.id === hex);
                if (!tile) return;
                const status = tile.statuses.find(s => s.id === statusId);
                const timerSpan = badge.querySelector('.status-timer');
                if (status && status.expiresAt && timerSpan) {
                    timerSpan.textContent = formatRemaining(status.expiresAt - Date.now());
                }
            });
            // re-render if statuses removed
            if (changed) renderTiles();
        }

        function editStatusName(tileId, statusId) {
            const tile = tiles.find(t => t.id === tileId);
            if (!tile) return;
            const status = tile.statuses.find(s => s.id === statusId);
            if (!status) return;
            const newName = prompt('Status name:', status.name);
            if (newName && newName.trim() !== '') {
                status.name = newName.trim();
                saveTiles();
                renderTiles();
            }
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadTiles();
            // tick every second for timers
            setInterval(updateTimers, 1000);
        });
    </script>
</body>
</html>
